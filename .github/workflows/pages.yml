name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
    # Alterações do app e do site são publicadas pelo fluxo do APK,
    # que também inclui o APK oficial no mesmo deploy.
    paths-ignore:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.env.production'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Compartilha o bloqueio com o fluxo do APK para impedir publicações concorrentes.
concurrency:
  group: android-official-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes automatizados
        run: npm test
      - run: npm run build
      - name: Preservar o APK oficial na publicação do site
        run: |
          mkdir -p dist/downloads
          curl --fail --location --retry 3 --retry-all-errors \
            https://oficiodomotor.github.io/downloads/OficioDoMotor.apk \
            --output dist/downloads/OficioDoMotor.apk
          test -s dist/downloads/OficioDoMotor.apk
      - name: Fallback SPA (rotas diretas como /orcamento/...)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
