name: App desktop (Windows e Mac)

# Gera os instaladores quando uma tag desktop-vX.Y.Z é enviada
# e anexa os arquivos numa Release do GitHub (é de lá que o botão do site baixa).
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: desktop:win
            nome: windows
          - os: macos-latest
            script: desktop:mac
            nome: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar instalador
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # Sem certificado de assinatura por enquanto (etapa opcional do DESKTOP.md).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.nome }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/*.blockmap

  publicar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Ofício do motor ${{ github.ref_name }}
          files: instaladores/*
          generate_release_notes: true