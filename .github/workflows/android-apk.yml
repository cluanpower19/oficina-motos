name: Build and publish official Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.env.production'
      - 'android/**'

permissions:
  contents: write
  pages: write
  id-token: write

# Serializa as publicações do APK e do site no mesmo ambiente GitHub Pages.
concurrency:
  group: android-official-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK and publish it on the website
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-key.p12
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate signing secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "::error::Configure ANDROID_KEYSTORE_BASE64 in repository Actions secrets." && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "::error::Configure ANDROID_KEYSTORE_PASSWORD in repository Actions secrets." && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "::error::Configure ANDROID_KEY_ALIAS in repository Actions secrets." && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "::error::Configure ANDROID_KEY_PASSWORD in repository Actions secrets." && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website including the official APK
        run: |
          npm run build
          mkdir -p dist/downloads
          cp android/app/build/outputs/apk/release/app-release.apk dist/downloads/OficioDoMotor.apk
          cp dist/index.html dist/404.html

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/app/release-key.p12

  deploy:
    name: Deploy official APK website
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website with official APK
        id: deployment
        uses: actions/deploy-pages@v4
